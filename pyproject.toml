[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "occam"
version = "0.2.0"
description = "Auditable TTP extraction, campaign clustering and ACH attribution with confidence grading"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rakshit" }]
keywords = ["threat-intelligence", "mitre-attack", "attribution", "ach", "stix"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
]
# The core (extraction, ACH, STIX export, CLI) is standard-library only.
dependencies = []

[project.optional-dependencies]
ml = ["scikit-learn>=1.3", "numpy>=1.24", "scipy>=1.10"]
graph = ["networkx>=3.1"]
stix = ["stix2>=3.0"]
api = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]
pdf = ["pypdf>=4"]
bench = ["matplotlib>=3.7"]
all = ["occam[ml,graph,stix,api,pdf,bench]"]
dev = ["pytest>=7", "ruff>=0.5", "occam[ml,graph,stix,api]"]

[project.scripts]
occam = "occam.cli:main"

[project.urls]
Homepage = "https://github.com/rakshit-737/occam"

[tool.setuptools]
packages = ["occam", "occam.data", "occam.web"]

[tool.setuptools.package-data]
"occam.data" = ["*.json"]
"occam.web" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["realdata: needs the downloaded datasets (skipped when absent)"]

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["occam"]
