name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Builds (including pull-request builds) never share a concurrency group, so a
# queued PR build can no longer cancel another; only the Pages deployment is
# serialised.
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[docs]"
      - run: python -m mkdocs build --strict
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the static workbench demo into the site
        working-directory: ui
        run: |
          npm ci
          npm audit --audit-level=high
          npm test
          VITE_STATIC=1 OCCAM_UI_OUT=../site/demo npm run build
      - name: Build the preprint PDF into the site (/preprint.pdf)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends latexmk texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra lmodern > /dev/null
          (cd paper && latexmk -pdf -interaction=nonstopmode -halt-on-error occam.tex > /dev/null)
          cp paper/occam.pdf site/preprint.pdf
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
