[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "occam"
version = "0.1.0"
description = "Auditable TTP extraction, campaign clustering and ACH attribution with confidence grading"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
occam = "occam.cli:main"

[tool.setuptools]
packages = ["occam", "occam.data"]

[tool.setuptools.package-data]
"occam.data" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
