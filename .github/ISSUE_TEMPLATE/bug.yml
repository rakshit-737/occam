name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: Command or API call, full output, expected output }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: OCCAM version (occam --version) and Python version }
    validations: { required: true }
  - type: textarea
    id: input
    attributes: { label: Minimal input, description: "Synthetic or public input only; no TLP:RED or personal data" }
