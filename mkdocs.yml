site_name: OCCAM
site_description: Auditable TTP extraction, campaign clustering and ACH attribution with confidence grading
site_url: https://rakshit-737.github.io/occam/
repo_url: https://github.com/rakshit-737/occam
repo_name: rakshit-737/occam
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - How it works: how-it-works.md
  - Architecture: architecture.md
  - Evaluation: evaluation.md
  - Reproduce: reproduce.md
  - Datasets: data.md
  - Live demo: https://rakshit-737.github.io/occam/demo/
  - Reference:
      - CLI & HTTP: reference/cli.md
      - Python API: reference/api.md
  - Threat model: threat-model.md
  - Security: security.md
  - ADRs: adr/index.md
  - Changelog: changelog.md
  - Limitations & roadmap: limitations.md

not_in_nav: |
  adr/0*.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: {permalink: true}
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            show_source: false
            docstring_style: sphinx
            heading_level: 2
            show_root_heading: true
            show_if_no_docstring: true

validation:
  links:
    absolute_links: warn
    unrecognized_links: warn
