[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "occam"
version = "1.1.0"
description = "Auditable TTP extraction, campaign clustering and ACH attribution with confidence grading"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rakshit" }]
keywords = ["threat-intelligence", "mitre-attack", "attribution", "ach", "stix"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]
# The core (extraction, ACH, STIX export, CLI) is standard-library only.
dependencies = []

[project.optional-dependencies]
ml = ["scikit-learn>=1.5", "numpy>=1.24", "scipy>=1.10"]
graph = ["networkx>=3.4.2"]
stix = ["stix2>=3.0"]
api = ["fastapi>=0.115", "starlette>=1.3.1", "uvicorn>=0.27", "httpx>=0.27"]
pdf = ["pypdf>=6.19.0"]
bench = ["matplotlib>=3.7"]
all = ["occam[ml,graph,stix,api,pdf,bench]"]
docs = ["mkdocs-material>=9.7.7", "mkdocstrings[python]>=0.26", "mkdocs-redirects>=1.2"]
dev = ["pytest>=9.0.3", "ruff==0.16.10", "build>=1.2", "occam[ml,graph,stix,api]"]

[project.scripts]
occam = "occam.cli:main"

[project.urls]
Homepage = "https://rakshit-737.github.io/occam/"
Source = "https://github.com/rakshit-737/occam"

[tool.setuptools]
packages = ["occam", "occam.data", "occam.demo", "occam.demo.reports", "occam.demo.scenarios", "occam.web"]

[tool.setuptools.package-data]
"occam.data" = ["*.json"]
"occam.web" = ["*.html"]
"occam.demo" = ["*.json"]
"occam.demo.reports" = ["*.txt"]
"occam.demo.scenarios" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["realdata: needs the downloaded datasets (skipped when absent)"]
filterwarnings = [
  "error::DeprecationWarning",
  # starlette's TestClient-on-httpx deprecation: tracked, not ours to fix yet
  "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["occam"]
known-local-folder = ["conftest"]
